; The prose gate for this repository. Run it from the repository root:
;
;   vale --minAlertLevel=error --glob='!.claude/**' .
;
; `scripts/gates.sh` runs exactly this, and says why the glob is needed.
;
; StylesPath points straight at the shipped styles, so no rule file is copied.
; The settings below are a copy of docs-linter/assets/vale/.vale.ini, which owns
; them. The docs-linter skill says why each one is there. Vale has no include,
; so they repeat here.
StylesPath = docs-linter/assets/vale/styles
MinAlertLevel = warning
Vocab = Project

[*.md]
BasedOnStyles = Vale, Docs
Vale.Spelling = NO

