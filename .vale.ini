; The prose gate for this repository. Run it from the repository root:
;
;   vale --minAlertLevel=error .
;
; StylesPath points straight at the shipped styles. The docs-linter skill tells
; a consuming project to copy them to its root, because that project does not
; hold them; this repository does, and a copy here would be the second home of
; every rule.
StylesPath = docs-linter/assets/vale/styles
MinAlertLevel = warning
Vocab = Project

[*.md]
; Vale must be listed for the Project vocabulary to fire. Without it,
; accept.txt and reject.txt are dead config that looks like it works.
BasedOnStyles = Vale, Docs
Vale.Spelling = NO

BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (\x60[^\n\x60]+\x60)
