StylesPath = styles
MinAlertLevel = warning
Vocab = Project

[*.md]
# Vale.Avoid and Vale.Terms, which read reject.txt and enforce the
# capitalisation in accept.txt, run only with Vale listed here.
BasedOnStyles = Vale, Docs
Vale.Spelling = NO

# No BlockIgnores and no TokenIgnores: Vale already skips fenced blocks and
# inline code in Markdown. A hand-written BlockIgnores pattern for fences
# swallowed every line after the first fence, and the gate went quiet.
